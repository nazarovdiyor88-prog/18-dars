<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sass/main.css">
</head>
<body>
    <main class="wrapper">
        <div class="container">
            <h1 class="wrapper__title">Student Registration Form Using Table in HTML</h1>
            <div class="wrapper__box">
                <form action="" class="wrapper__box__forma">
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">First Name</label>
                        <input form="name" type="text" placeholder="Ghanendra" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(Max 50 Characters Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Last Name</label>
                        <input form="name" type="text" placeholder="Yadov" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(Max 50 Characters Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Email ID</label>
                        <input type="email" placeholder="Yghandendra@gmail.com" class="wrapper__box__forma__boxone__input">
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Mobile Number</label>
                        <input type="tel" placeholder="7842xxxxxxx" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(10 Digits Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Gender</label>
                        <div>
                            <input form="name" type="radio" class="wrapper__box__forma__boxone__input">
                            <label for="name" class="wrapper__box__forma__boxone__title">Male</label>
                            <input form="name" type="radio" class="wrapper__box__forma__boxone__input">
                            <label for="name" class="wrapper__box__forma__boxone__title">Female</label>
                        </div>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Date of Birth(DOB)</label>
                        <input form="name" type="date" placeholder="" class="wrapper__box__forma__boxone__input">
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Address</label>
                        <textarea name="Address" id="Address"></textarea>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">City</label>
                        <input form="name" type="text" placeholder="Tashkent" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(Max 50 Characters Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Pin code</label>
                        <input form="name" type="number" placeholder="560068" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(Max 6 Number Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">State</label>
                        <input type="text" placeholder="Karnatake" class="wrapper__box__forma__boxone__input">
                        <label for="name" class="wrapper__box__forma__boxone__title">(Max 50 Characters Allowed)</label>
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <label for="name" class="wrapper__box__forma__boxone__title">Country</label>
                        <input form="name" type="text" placeholder="Urugvay" class="wrapper__box__forma__boxone__input">
                    </div>
                    <div class="wrapper__box__forma__boxone">
                        <div class="wrapper__box__forma__boxone__one">
                            <label for="name" class="wrapper__box__forma__boxone__title">Hobbies</label>
                            <div class="wrapper__box__forma__boxone__two">
                                <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                <label for="">Drawing</label>
                                <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                <label for="">Singing</label>
                                <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                <label for="">Dancing</label>
                                <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                <label for="">Sketching</label>
                                <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                <label for="">Others</label><br>
                                <input type="text" placeholder="Ex-Teaching" class="wrapper__box__forma__boxone__two__input">
                                <label for="name" class="wrapper__box__forma__boxone__two__title">(Max 50 Characters Allowed)</label>
                            </div>
                        </div>
                        <div class="wrapper__box__forma__boxone__box">
                            <div class="wrapper__box__forma__boxone__one">
                                <label for="name" class="wrapper__box__forma__boxone__title">Qualification</label>
                                    <div class="wrapper__box__forma__boxone__box__one__two">
                                        <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">High School(10th)</label><br>
                                        <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">Higher School(12th)</label><br>
                                        <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">Graduation(Beachelors)</label><br>
                                        <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">Post Graduation(Master)</label><br>
                                        <input type="checkbox" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">Phd</label>
                                </div>
                            </div>
                        </div>
                        <div class="wrapper__box__forma__boxone__box">
                            <div class="wrapper__box__forma__boxone__one">
                                <label for="name" class="wrapper__box__forma__boxone__title">Courses Applied For</label>
                                    <div class="wrapper__box__forma__boxone__box__one__two">
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">BCA (Bachelor of Computer Applications)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">B.Com(Bachelor of Commerce)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">B.Sc(Bachelor of Science)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">BA(Bachelor Of Arts)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">MCA(Master of Applications)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">M.Com(Master of Commerce)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">M.Sc(Master of Science)</label><br>
                                        <input type="radio" class="wrapper__box__forma__boxone__two__input">
                                        <label for="">MA(Master Of Arts)</label>
                                </div>
                            </div> 
                        </div>
                    </div>
                    <input type="button" value="Submit" class="wrapper__box__forma__btn">
                    <input type="button" value="Reset" class="wrapper__box__forma__btn">
                </form>
            </div>
        </div>
    </main>  
</body>
</html>
